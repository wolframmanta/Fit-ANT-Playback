[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fit-ant-playback"
version = "1.2.1"
description = "Replay FIT power and cadence data as an ANT+ Bike Power source."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fitdecode>=0.10.0",
    "PySide6>=6.7.0",
    "pyusb>=1.2.1",
]

[project.optional-dependencies]
test = []

[project.scripts]
fit-ant-playback = "fit_ant_playback:main"
fit-ant-playback-qt = "fit_ant_playback_qt:main"

[tool.setuptools]
py-modules = ["fit_ant_playback", "fit_ant_playback_qt"]
packages = ["fit_ant_playback_core"]
